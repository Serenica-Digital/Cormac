name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check RLS on every table
        run: pnpm check:rls

      - name: Secret scan
        run: pnpm check:secrets

      - name: Start Supabase (applies migrations)
        run: pnpm exec supabase start

      - name: Export Supabase env
        run: |
          set -a; source <(pnpm exec supabase status -o env); set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Test (unit + cross-tenant isolation)
        run: pnpm test

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop || true
