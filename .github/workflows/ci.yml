name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check RLS on every table
        run: pnpm check:rls

      - name: Secret scan
        run: pnpm check:secrets

      - name: Start Supabase (applies migrations)
        run: pnpm exec supabase start

      - name: Export Supabase env
        run: |
          set -a; source <(pnpm exec supabase status -o env); set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Test (unit + cross-tenant isolation)
        run: pnpm test

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop || true

  # The deployment artifacts Juno pulls (ADR-017): one image per workload,
  # private on GHCR, tagged with the commit and the branch. The hermes-runtime
  # image bakes the profile from docker/hermes-runtime/; secrets stay
  # env-injected at deploy and never enter an image.
  publish-images:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.node
            build-args: SERVICE=api
          - name: worker
            dockerfile: docker/Dockerfile.node
            build-args: SERVICE=worker
          - name: web
            dockerfile: docker/Dockerfile.web
            build-args: ''
          - name: hermes-runtime
            dockerfile: docker/Dockerfile.hermes
            build-args: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ghcr.io/serenica-digital/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/serenica-digital/${{ matrix.name }}:${{ github.ref_name }}
