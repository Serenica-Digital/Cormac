name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint and render the Helm charts (the deploy artifact, ADR-035)
        run: |
          for c in api worker web pane hermes-runtime; do
            echo "== $c =="
            helm lint "deploy/helm/$c"
            helm template cormac "deploy/helm/$c" -n cormac > /dev/null
          done

      - name: Check RLS on every table
        run: pnpm check:rls

      - name: Secret scan
        run: pnpm check:secrets

      - name: Check control register (claim -> control -> test chain)
        run: pnpm check:controls

      - name: Check env artifacts are regenerated (manifest -> .env.example, Helm)
        run: pnpm check:env

      - name: Check eval fixtures (structural, no model calls)
        run: pnpm check:eval-fixtures

      - name: Start Supabase (applies migrations)
        run: pnpm exec supabase start

      - name: Export Supabase env
        run: |
          pnpm exec supabase status -o json > /tmp/sb.json
          node -e '
            const s = require("/tmp/sb.json"), fs = require("fs");
            const map = { SUPABASE_URL: "API_URL", SUPABASE_ANON_KEY: "ANON_KEY", SUPABASE_SERVICE_ROLE_KEY: "SERVICE_ROLE_KEY", SUPABASE_JWT_SECRET: "JWT_SECRET" };
            for (const [out, key] of Object.entries(map)) {
              if (!s[key]) { console.error("supabase status -o json missing " + key); process.exit(1); }
              fs.appendFileSync(process.env.GITHUB_ENV, out + "=" + s[key] + "\n");
            }
          '

      - name: Test (unit + cross-tenant isolation)
        run: pnpm test

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop || true

  # The deployment artifacts Juno pulls (ADR-017): one image per workload,
  # private on GHCR, tagged with the commit and the branch. The hermes-runtime
  # image bakes the profile from docker/hermes-runtime/; secrets stay
  # env-injected at deploy and never enter an image.
  publish-images:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.node
            build-args: SERVICE=api
          - name: worker
            dockerfile: docker/Dockerfile.node
            build-args: SERVICE=worker
          - name: web
            dockerfile: docker/Dockerfile.web
            build-args: ''
          - name: pane
            dockerfile: docker/Dockerfile.pane
            build-args: ''
          - name: hermes-runtime
            dockerfile: docker/Dockerfile.hermes
            build-args: ''
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ghcr.io/serenica-digital/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/serenica-digital/${{ matrix.name }}:${{ github.ref_name }}
