# Cormac web app. It holds NO secrets and NO database access. The browser VITE_*
# values are baked into the bundle at BUILD time (Vite caveat, deployment-setup.md),
# so they are not runtime container env: env/secretEnv are empty and check:env does
# not expect VITE_* here. Set the VITE_* below as build-args when the image is built.
serviceName: cormac-web
replicas: 1
port: 5174
healthPath: /

image:
  repository: ghcr.io/serenica-digital/web
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecret: ghcr-pull

service:
  port: 5174

# Admin/trust door: auth-gated. Use ingress-noauth for a shareable client preview.
networkMode: ingress-auth
ingress:
  enabled: true
  className: nginx
  host: app.cormac.example.com # PLACEHOLDER
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod # PLACEHOLDER
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

secretName: cormac-secrets

# No runtime env; VITE_* are build-args (documented, not injected here).
env: {}
secretEnv: []
emptyDirMounts: []

# Documentation only (NOT runtime env): the build-args to bake into the web image.
viteBuildArgs:
  VITE_API_URL: https://api.cormac.example.com
  VITE_SUPABASE_URL: https://PROJECT-REF.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_PLACEHOLDER
