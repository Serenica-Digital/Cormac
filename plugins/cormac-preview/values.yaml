# Experimental adapter only. The canonical deployment definitions remain in
# deploy/charts/** (ADR-0003). Run deploy/juno/prepare-terra-source.sh after a
# canonical chart change to refresh the vendored dependencies.

control-plane:
  image:
    repository: ghcr.io/serenica-digital/cormac-control-plane
    tag: "6c81617"
    pullPolicy: IfNotPresent
  imagePullSecret: ghcr-pull
  secretName: cormac-secrets
  ingress:
    enabled: false
  env:
    APP_ENV: staging
    API_PORT: "8080"
    CORS_ORIGINS: "http://localhost:15174"
    SUPABASE_URL: https://tcemqghhhfllvmmncshe.supabase.co
    SUPABASE_ANON_KEY: ""
    HERMES_AUTHORING_URL: http://cormac-hermes-authoring:8644
    HERMES_OPS_URL: http://cormac-hermes-ops:8645
    HERMES_TIMEOUT_MS: "120000"

web:
  image:
    repository: ghcr.io/serenica-digital/cormac-web
    tag: "6c81617"
    pullPolicy: IfNotPresent
  imagePullSecret: ghcr-pull
  ingress:
    enabled: false

hermes-authoring:
  serviceName: cormac-hermes-authoring
  port: 8644
  service:
    port: 8644
  image:
    repository: ghcr.io/serenica-digital/cormac-hermes
    tag: "6c81617"
    pullPolicy: IfNotPresent
  imagePullSecret: ghcr-pull
  secretName: cormac-secrets
  env:
    PROFILE: cormac-authoring
    API_SERVER_PORT: "8644"
    CORMAC_CONTROL_PLANE_URL: http://cormac-control-plane:8080
  secretEnv:
    - HERMES_API_KEY
    - ANTHROPIC_API_KEY
    - CORMAC_AGENT_TOKEN

hermes-ops:
  serviceName: cormac-hermes-ops
  port: 8645
  service:
    port: 8645
  image:
    repository: ghcr.io/serenica-digital/cormac-hermes
    tag: "6c81617"
    pullPolicy: IfNotPresent
  imagePullSecret: ghcr-pull
  secretName: cormac-secrets
  env:
    PROFILE: cormac-operations
    API_SERVER_PORT: "8645"
    CORMAC_CONTROL_PLANE_URL: http://cormac-control-plane:8080
  secretEnv:
    - HERMES_API_KEY
    - ANTHROPIC_API_KEY
    - CORMAC_OPS_AGENT_TOKEN
