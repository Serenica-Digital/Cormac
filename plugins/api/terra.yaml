# Terra plugin descriptor (ADR-039). A Terra plugin is this Helm chart plus this
# file, under plugins/<name>/ at the Source repo root (Terra discovers only
# plugins/*/terra.yaml). Terra creates one ArgoCD Application per plugin pointing
# at this directory; ArgoCD syncs the chart. The chart stays plain, portable
# Kubernetes and this file is inert to Helm, so a plain `helm install plugins/api`
# still works and Juno stays swappable (ADR-017).
resource_id: cormac-api
name: Cormac Control Plane (api)
icon: "" # optional; a raw image URL can be added later
description: >-
  The control plane: the only writer of business records. Public webhook routes
  verified in-app (ingress-noauth), sole holder of the Supabase service key,
  serves the runtime's MCP tools at /mcp. CI-built image from this repo.
category: Application
tags:
  - cormac
  - serenica
  - control-plane
  - ingress-noauth
# Operator install inputs. By the Terra contract a field `name` injects into a
# chart value; the proven plugins use flat top-level keys, while our chart reads
# nested values (image.tag, ingress.host). Whether Terra's injection resolves the
# dotted path or needs a flat key is the one item to verify at the kind rehearsal
# (ADR-039 open item). Each description names the value the field is meant to set.
fields:
  - name: image_tag
    description: The CI-built image tag to deploy (commit sha; sets image.tag).
    required: true
    default: latest
    type: string
  - name: ingress_host
    description: Public host for the api (Twilio/Graph webhooks); sets ingress.host.
    required: true
    default: api.cormac.example.com
    type: string
  - name: cluster_issuer
    description: cert-manager ClusterIssuer name for TLS; sets ingress.tls.clusterIssuer.
    required: true
    default: letsencrypt-prod
    type: string
  - name: image_pull_secret
    description: docker-registry Secret for GHCR; must exist BEFORE deploy (juno_k3s race).
    required: true
    default: ghcr-pull
    type: string
