# Cormac Excel task pane. Holds NO secrets and NO database access. Two hard
# constraints (deployment-setup.md, ADR-031):
#  1. STABLE CUSTOM DOMAIN + TLS: the Office add-in manifest pins this URL nearly
#     permanently. cert-manager is an available Terra plugin, so the ingress sets
#     host + tls + cluster-issuer. If Juno cannot serve a per-workload custom host
#     (onboarding question), the fallback is a CDN (Cloudflare) in front of this.
#  2. The static server MUST NOT send `X-Frame-Options: SAMEORIGIN` (Excel loads
#     the pane in a webview frame). That is the static-server image's response
#     config, not something the chart can enforce; verify it in the image.
# VITE_* are baked at BUILD time, so env/secretEnv are empty (check:env expects none).
serviceName: cormac-pane
replicas: 1
port: 5175
healthPath: /

image:
  repository: ghcr.io/serenica-digital/pane
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecret: ghcr-pull

service:
  port: 5175

# Excel loads the pane directly: public, no Hubble auth gate.
networkMode: ingress-noauth
ingress:
  enabled: true
  className: nginx
  host: pane.cormac.example.com # PLACEHOLDER — the manifest-pinned domain; confirm at onboarding
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod # PLACEHOLDER
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

secretName: cormac-secrets

# No runtime env; VITE_* are build-args (documented, not injected here).
env: {}
secretEnv: []
emptyDirMounts: []

# Documentation only (NOT runtime env): the build-args to bake into the pane image.
viteBuildArgs:
  VITE_API_URL: https://api.cormac.example.com
  VITE_SUPABASE_URL: https://PROJECT-REF.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_PLACEHOLDER
  # Entra Lanes A/B; leave unset to ship Lane 0 (email/password) + dialog fallback.
  VITE_ENTRA_CLIENT_ID: ""
  VITE_ENTRA_AUTHORITY: https://login.microsoftonline.com/common
