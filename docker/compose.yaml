# Local orchestration of the Cormac services. Supabase runs separately via
# `pnpm db:start` (its own Docker stack); these services connect to it on the
# host. This compose file is local-only: on Juno each service below becomes its
# own workload running the same image (see docs/prd/juno-platform-pilot.md).
#
# Note what the hermes runtime does NOT get: any Supabase env. The runtime holds
# no database credentials (ADR-005, ADR-006); its only reach into CRM data is
# the control plane's MCP tool surface, bound to one workspace by
# MCP_WORKSPACE_TOKEN. That invariant is visible right here.
name: serenica

services:
  hermes:
    # The product runtime (ADR-006, ADR-025), pinned; never :latest. The
    # profile (config, SOUL, hooks) is versioned in docker/hermes-runtime/ and
    # copied into the data volume at start: the image's config migrator
    # rewrites config.yaml in place, so a read-only bind mount would break it.
    # `gateway run` is the documented headless mode (API server, no TTY); the
    # image's default CMD is the interactive CLI and exits without one.
    image: nousresearch/hermes-agent:v2026.6.5
    # The image entrypoint is /init + a wrapper that routes "gateway run" to
    # `hermes gateway run`; the shim only copies the profile in first.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cp /profile/config.yaml /opt/data/config.yaml &&
        cp /profile/SOUL.md /opt/data/SOUL.md &&
        mkdir -p /opt/data/agent-hooks &&
        cp /profile/agent-hooks/* /opt/data/agent-hooks/ &&
        chmod 755 /opt/data/agent-hooks/* &&
        chown -R hermes:hermes /opt/data/config.yaml /opt/data/SOUL.md /opt/data/agent-hooks &&
        exec /init /opt/hermes/docker/main-wrapper.sh gateway run
    environment:
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: '0.0.0.0'
      API_SERVER_PORT: '8642'
      API_SERVER_KEY: '${RUNTIME_API_KEY}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY}'
      # The profile's pre_tool_call deny hook is ours; accept it headlessly.
      HERMES_ACCEPT_HOOKS: '1'
      # Interpolated into config.yaml by Hermes (${VAR} syntax).
      MCP_SERVER_URL: 'http://api:8088/mcp'
      MCP_WORKSPACE_TOKEN: '${MCP_WORKSPACE_TOKEN}'
      # No messaging platform tokens on purpose: gateways activate only when
      # their token is present, so connector ingress stays with the control
      # plane (ADR-005, ADR-007).
    volumes:
      - hermes-data:/opt/data
      - ./hermes-runtime:/profile:ro
    # Exposed on the host for direct inspection during the spike only; the
    # Juno workload has no public route at all (clusterip).
    ports:
      - '8642:8642'
    # The image HEALTHCHECK is process-liveness only; probe HTTP instead.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8642/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 4

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    command: pnpm --filter @serenica/api run start
    environment:
      API_PORT: '8088'
      RUNTIME_KIND: 'hermes'
      RUNTIME_URL: 'http://hermes:8642'
      RUNTIME_API_KEY: '${RUNTIME_API_KEY}'
      RUNTIME_TIMEOUT_MS: '${RUNTIME_TIMEOUT_MS:-90000}'
      # The runtime's tool surface (/mcp): the token binds every tool call to
      # this workspace (ADR-025).
      MCP_WORKSPACE_ID: '${MCP_WORKSPACE_ID}'
      MCP_WORKSPACE_TOKEN: '${MCP_WORKSPACE_TOKEN}'
      # Inside the container, the host's Supabase is reachable only via
      # host.docker.internal; do not inherit the host's 127.0.0.1 URL.
      SUPABASE_URL: 'http://host.docker.internal:54321'
      # Tokens are issued under the host-side URL, so the issuer check needs the
      # explicit value (ADR-020; see SUPABASE_AUTH_ISSUER in apps/api config).
      SUPABASE_AUTH_ISSUER: '${SUPABASE_AUTH_ISSUER:-http://127.0.0.1:54321/auth/v1}'
      SUPABASE_SERVICE_ROLE_KEY: '${SUPABASE_SERVICE_ROLE_KEY}'
      SUPABASE_JWT_SECRET: '${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - hermes
    ports:
      - '8088:8088'
    # node:22-slim ships no curl; node's built-in fetch is the probe.
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:8088/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 4

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    command: pnpm --filter @serenica/worker run start
    environment:
      WORKER_PORT: '8070'
    ports:
      - '8070:8070'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:8070/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 4

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    command: pnpm --filter @serenica/web run dev
    environment:
      VITE_API_URL: '${VITE_API_URL:-http://localhost:8088}'
      VITE_SUPABASE_URL: '${VITE_SUPABASE_URL:-http://localhost:54321}'
      VITE_SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY}'
    depends_on:
      - api
    ports:
      - '5174:5174'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:5174/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 4

volumes:
  hermes-data:
