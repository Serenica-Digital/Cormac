# Infisical SecretStore for the External Secrets Operator (ADR-035/036). One
# namespaced SecretStore, identical on local k3d and Juno (single `cormac`
# namespace) -- no ClusterSecretStore, because a single namespace needs only a
# namespaced store. Auth is a machine identity (Universal Auth) whose client
# id/secret live in the bootstrap k8s secret `infisical-auth` (see
# infisical-auth.example.yaml), created out of band by the operator. No secret
# value lives in this file.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical
  namespace: cormac
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com/api # PLACEHOLDER if self-hosted
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-auth
            namespace: cormac
            key: clientId
          clientSecret:
            name: infisical-auth
            namespace: cormac
            key: clientSecret
      secretsScope:
        projectSlug: cormac-wyw2 # Infisical project slug
        environmentSlug: dev # managed dev Supabase; k3d and Juno both source this (ADR-036)
        secretsPath: /
