# Infisical SecretStore for the External Secrets Operator (ADR-035). Namespaced
# for k3d (local); on Juno use a ClusterSecretStore with the same provider block.
# Auth is a machine identity (Universal Auth) whose client id/secret live in the
# bootstrap k8s secret `infisical-auth` (see infisical-auth.example.yaml), created
# out of band by the operator. No secret value lives in this file.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical
  namespace: cormac
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com/api # PLACEHOLDER if self-hosted
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-auth
            namespace: cormac
            key: clientId
          clientSecret:
            name: infisical-auth
            namespace: cormac
            key: clientSecret
      secretsScope:
        projectSlug: cormac-PLACEHOLDER # Infisical project slug
        environmentSlug: dev # local k3d uses the managed dev Supabase project (ADR-035)
        secretsPath: /
