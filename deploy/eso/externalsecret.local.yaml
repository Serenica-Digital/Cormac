# Local k3d variant of the ExternalSecret (ADR-035). Same as externalsecret.yaml,
# plus SUPABASE_JWT_SECRET: the local posture is APP_ENV=local (HS256 against the
# local Supabase stack), so the api needs the JWT secret. The committed
# externalsecret.yaml omits it on purpose, because prod verifies JWKS-only and
# must not hold the dev secret (ADR-020). Apply this one only for local k3d.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cormac-secrets
  namespace: cormac
  labels:
    app.kubernetes.io/part-of: cormac
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: SecretStore
  target:
    name: cormac-secrets
    creationPolicy: Owner
  data:
    - secretKey: SUPABASE_SERVICE_ROLE_KEY
      remoteRef: { key: SUPABASE_SERVICE_ROLE_KEY }
    - secretKey: SUPABASE_JWT_SECRET # local/HS256 only; omit in a prod environment (ADR-020)
      remoteRef: { key: SUPABASE_JWT_SECRET }
    - secretKey: RUNTIME_API_KEY
      remoteRef: { key: RUNTIME_API_KEY }
    - secretKey: API_SERVER_KEY # same value as RUNTIME_API_KEY by construction
      remoteRef: { key: RUNTIME_API_KEY }
    - secretKey: MCP_WORKSPACE_TOKEN
      remoteRef: { key: MCP_WORKSPACE_TOKEN }
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: ANTHROPIC_API_KEY }
