# Synthesizes the one k8s Secret the charts consume (`cormac-secrets`) from
# Infisical via ESO (ADR-035). The deployment templates do not change; this only
# changes the Secret's provenance from a hand-made kubectl secret to a managed,
# rotatable, audited store. API_SERVER_KEY maps from the SAME Infisical secret as
# RUNTIME_API_KEY, so the api and the runtime always share one value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cormac-secrets
  namespace: cormac
  labels:
    app.kubernetes.io/part-of: cormac
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: SecretStore
  target:
    name: cormac-secrets
    creationPolicy: Owner
  data:
    - secretKey: SUPABASE_SERVICE_ROLE_KEY
      remoteRef: { key: SUPABASE_SERVICE_ROLE_KEY }
    - secretKey: RUNTIME_API_KEY
      remoteRef: { key: RUNTIME_API_KEY }
    - secretKey: API_SERVER_KEY # the runtime's bearer; same value as RUNTIME_API_KEY by construction
      remoteRef: { key: RUNTIME_API_KEY }
    - secretKey: MCP_WORKSPACE_TOKEN
      remoteRef: { key: MCP_WORKSPACE_TOKEN }
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: ANTHROPIC_API_KEY }
