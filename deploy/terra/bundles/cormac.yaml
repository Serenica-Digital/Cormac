# Terra bundle (ADR-036): the Cormac application stack as one launchable unit.
# Groups the five workload plugins (whose terra.yaml + Helm chart live in
# deploy/helm/<workload>/) with shared install fields. Modeled on the public
# orion-essentials bundle. The plugins are resolved from this repo once it is
# registered as a Terra Source (see ../README.md).
#
# Not in this bundle (deliberately): managed Supabase (external system of record,
# never a workload, ADR-036) and the dev workloads (web-ide / Jarvis / gitea are
# official Juno plugins, see docs/runbooks/juno-dev-workspace.md).
resource_id: cormac
name: Cormac
description: >-
  The Cormac application stack: control plane (api), web, Excel pane (gated on
  ADR-028), worker, and the headless Hermes product runtime. CI-built images
  from this repo; managed Supabase is the external system of record.
category: Bundle
tags:
  - cormac
  - serenica
  - application
  - first time setup

# Plugins included, with the per-plugin fields the bundle surfaces. cormac-pane
# is gated on the ADR-028 GO/NO-GO; omit it from the launch until a GO.
plugins:
  - resource_id: cormac-api
  - resource_id: cormac-web
  - resource_id: cormac-worker
  - resource_id: cormac-hermes-runtime
  - resource_id: cormac-pane # gated on ADR-028 GO/NO-GO

# Bundle-level install fields. These are the cluster-facts confirmed at the Juno
# onboarding session (see ../README.md and docs/runbooks/deploy-to-juno.md).
fields:
  - name: namespace
    description: The Juno project namespace to deploy into.
    required: true
    default: cormac
    type: string
  - name: image_tag
    description: The CI-built image tag for every workload (commit sha).
    required: true
    default: latest
    type: string
  - name: image_pull_secret
    description: docker-registry Secret for GHCR; must exist BEFORE deploy (juno_k3s race).
    required: true
    default: ghcr-pull
    type: string
  - name: base_domain
    description: "Base domain for ingress hosts (api.<base>, app.<base>, pane.<base>)."
    required: true
    default: cormac.example.com
    type: string
  - name: cluster_issuer
    description: cert-manager ClusterIssuer name for TLS on the ingress workloads.
    required: true
    default: letsencrypt-prod
    type: string
