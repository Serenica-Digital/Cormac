# Local k3d overlay for the api (ADR-035). Merge over the chart defaults:
#   helm upgrade --install cormac-api deploy/helm/api -n cormac -f deploy/helm/api/values.local.yaml
# Posture: managed dev Supabase, so APP_ENV=dev (ES256/JWKS-only, fail-closed
# rules ON). The api therefore needs the real managed project URL/anon below and
# the secrets in cormac-secrets to boot. The image is built locally and imported
# into k3d (no GHCR pull).
image:
  repository: cormac/api
  tag: dev
  pullPolicy: IfNotPresent
imagePullSecret: "" # imported into k3d; no registry pull

# Reached from the host with `kubectl port-forward svc/cormac-api 8088:8088`.
ingress:
  enabled: false

# Only the keys that differ from the chart default; Helm deep-merges the rest.
env:
  APP_ENV: dev
  # Set these to YOUR managed dev project (non-secret; the anon key is publishable).
  SUPABASE_URL: https://tcemqghhhfllvmmncshe.supabase.co # managed dev project
  SUPABASE_ANON_KEY: sb_publishable_azl7Qv5V07FntxmSRIzrAw_-dFp4ApS # managed dev publishable key (non-secret)
  SUPABASE_AUTH_ISSUER: "" # JWKS path infers it from SUPABASE_URL
  # The host frontends (pane 5175 https, web 5174) and smoke call the api.
  CORS_ORIGINS: https://localhost:5175,https://127.0.0.1:5175,http://localhost:5174,http://127.0.0.1:5174
  # On for the pane SSE probe (M1) against the k3d backend.
  SSE_PROBE_ENABLED: "true"
