# The one k8s Secret every workload reads via secretKeyRef (ADR-034). DO NOT
# COMMIT REAL VALUES. Create it out-of-band BEFORE deploy (the juno_k3s image-pull
# race applies to any pre-deploy secret). Two ways:
#
# 1. kubectl (quickest):
#    kubectl create secret generic cormac-secrets \
#      --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
#      --from-literal=RUNTIME_API_KEY="$(openssl rand -hex 24)" \
#      --from-literal=API_SERVER_KEY="<same value as RUNTIME_API_KEY>" \
#      --from-literal=MCP_WORKSPACE_TOKEN="$(openssl rand -hex 24)" \
#      --from-literal=ANTHROPIC_API_KEY=<from console.anthropic.com>
#    # SUPABASE_JWT_SECRET is intentionally omitted in prod (JWKS-only, ADR-020).
#
# 2. Apply this manifest after filling stringData (then delete your local copy).
#
# Image pull secret for the private GHCR images (also create BEFORE deploy):
#    kubectl create secret docker-registry ghcr-pull \
#      --docker-server=ghcr.io --docker-username=<gh-user> \
#      --docker-password=<PAT with read:packages>
#    # A default gh CLI token lacks read:packages; mint a fine-grained PAT.
apiVersion: v1
kind: Secret
metadata:
  name: cormac-secrets
  labels:
    app.kubernetes.io/part-of: cormac
type: Opaque
stringData:
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_ME"
  RUNTIME_API_KEY: "REPLACE_ME" # openssl rand -hex 24
  API_SERVER_KEY: "REPLACE_ME" # MUST equal RUNTIME_API_KEY
  MCP_WORKSPACE_TOKEN: "REPLACE_ME" # openssl rand -hex 24
  ANTHROPIC_API_KEY: "REPLACE_ME"
  # SUPABASE_JWT_SECRET: set ONLY for an HS256/legacy project; omit in prod.
---
# --- External Secrets Operator alternative (Juno advertises ESO support) -------
