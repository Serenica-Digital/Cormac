# Terra plugin descriptor (ADR-036). See deploy/helm/api/terra.yaml for the model.
resource_id: cormac-hermes-runtime
name: Cormac Hermes Runtime (product)
icon: ""
description: >-
  The tenant-facing agent runtime: headless API server only, never publicly
  routable (clusterip), no database credentials, stateless per task. Carries a
  CronJob recycler + memory limit for the upstream leak (#25315). The chart
  renders a Service and no Ingress, so it does not depend on Juno's network_mode.
  This is OUR headless workload template, distinct from the official hermes-agent
  plugin (which fits Jarvis, not the product runtime). CI-built image from this repo.
category: Application
tags:
  - cormac
  - serenica
  - hermes-runtime
  - clusterip
fields:
  - name: image_tag
    description: The CI-built image tag (the image already pins nousresearch/hermes-agent); sets image.tag.
    required: true
    default: latest
    type: string
  - name: image_pull_secret
    description: docker-registry Secret for GHCR; must exist BEFORE deploy.
    required: true
    default: ghcr-pull
    type: string
  - name: recycle_schedule
    description: Cron schedule for the leak-recycle CronJob; sets recycle.schedule.
    required: false
    default: "0 */6 * * *"
    type: string
