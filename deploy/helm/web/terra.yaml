# Terra plugin descriptor (ADR-036). See deploy/helm/api/terra.yaml for the model.
resource_id: cormac-web
name: Cormac Web (admin/trust/fallback)
icon: ""
description: >-
  The web/PWA admin, trust, and fallback door. Auth-gated (ingress-auth).
  VITE_* are baked at build time; holds no secrets and no database access.
  CI-built image from this repo.
category: Application
tags:
  - cormac
  - serenica
  - web
  - ingress-auth
fields:
  - name: image_tag
    description: The CI-built image tag to deploy (commit sha; sets image.tag).
    required: true
    default: latest
    type: string
  - name: ingress_host
    description: Public host for the web app; sets ingress.host.
    required: true
    default: app.cormac.example.com
    type: string
  - name: cluster_issuer
    description: cert-manager ClusterIssuer name for TLS; sets ingress.tls.clusterIssuer.
    required: true
    default: letsencrypt-prod
    type: string
  - name: image_pull_secret
    description: docker-registry Secret for GHCR; must exist BEFORE deploy.
    required: true
    default: ghcr-pull
    type: string
