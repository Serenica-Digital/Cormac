# Terra plugin descriptor (ADR-039). A Terra plugin is this Helm chart plus this
# file, under plugins/<name>/ at the Source repo root (Terra discovers only
# plugins/*/terra.yaml). Terra creates one ArgoCD Application per plugin pointing
# at this directory; ArgoCD syncs the chart. The directory name MUST equal
# resource_id (Terra builds the install path from resource_id). The chart stays
# plain, portable Kubernetes and this file is inert to Helm, so a plain
# `helm install plugins/cormac-api` still works and Juno stays swappable (ADR-017).
resource_id: cormac-api
name: Cormac Control Plane (api)
icon: "" # optional; a raw image URL can be added later
description: >-
  The control plane: the only writer of business records. Public webhook routes
  verified in-app (ingress-noauth), sole holder of the Supabase service key,
  serves the runtime's MCP tools at /mcp. CI-built image from this repo.
category: Application
tags:
  - cormac
  - serenica
  - control-plane
  - ingress-noauth
# Operator install inputs. Terra injects each field as a FLAT top-level value
# (verified on live Terra v2.1.1), so the chart reads flat keys whose names match
# these fields exactly (image_tag, image_pull_secret, ingress_host, cluster_issuer).
fields:
  - name: image_tag
    description: The CI-built image tag to deploy (commit sha).
    required: true
    default: latest
    type: string
  - name: ingress_host
    description: Public host for the api (Twilio/Graph webhooks)
    required: true
    default: api.cormac.example.com
    type: string
  - name: cluster_issuer
    description: cert-manager ClusterIssuer name for TLS
    required: true
    default: letsencrypt-prod
    type: string
  - name: image_pull_secret
    description: docker-registry Secret for GHCR; must exist BEFORE deploy (juno_k3s race).
    required: true
    default: ghcr-pull
    type: string
