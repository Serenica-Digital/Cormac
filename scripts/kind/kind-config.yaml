# Juno-shaped kind cluster for the local rehearsal (scripts/kind/rehearsal-up.sh).
# Mirrors Juno-Bootstrap's .kind.yaml: host ports 80/443 mapped to the node so
# ingress-nginx is reachable at localhost (and via *.localtest.me), plus the Juno
# node labels so the topology matches the real platform. Self-contained: the base
# rehearsal needs no Juno-Bootstrap clone (only the optional WITH_GENESIS step does).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    labels:
      ingress-ready: "true"
      juno-innovations.com/workstation: true
      juno-innovations.com/service: true
